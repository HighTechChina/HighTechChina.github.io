# IndexNow 自动提交（Bing + Yandex + Seznam）
#
# 触发方式：
#   1. 手动触发：GitHub → Actions → "IndexNow Submission" → "Run workflow"
#   2. 推送触发：push 到 main 分支时自动执行
#   3. 定时触发：每天 02:00 UTC（北京时间 10:00）
#
# 前置条件：
#   - 仓库根目录有 .txt 格式的 key 文件（内容为 64 位 hex IndexNow key）
#   - 站点有可访问的 sitemap.xml（Hugo 默认生成）
#
# 注意：Google 不支持 IndexNow 协议。Google 收录需手动通过 Search Console 提交 sitemap。
name: IndexNow Submission

on:
  # 推送触发
  push:
    branches: [main]
  # 定时触发（每天 02:00 UTC = 北京时间 10:00）
  schedule:
    - cron: '0 2 * * *'
  # 手动触发
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract URLs from sitemap
        id: extract
        run: |
          # 从线上站点获取 sitemap
          SITE_URL="https://${{ github.repository_owner }}.github.io"
          SITEMAP_URL="${SITE_URL}/sitemap.xml"

          echo "Fetching sitemap from $SITEMAP_URL"
          HTTP_CODE=$(curl -s -o /tmp/sitemap.xml -w "%{http_code}" "$SITEMAP_URL" --max-time 30)

          if [ "$HTTP_CODE" = "200" ]; then
            URLS=$(grep -oP '<loc>\K[^<]+' /tmp/sitemap.xml | python3 -c "
            import sys, json
            urls = [l.strip() for l in sys.stdin if l.strip()]
            print(json.dumps(urls))
            ")
            COUNT=$(echo "$URLS" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
            echo "urls=$URLS" >> $GITHUB_OUTPUT
            echo "Extracted $COUNT URLs from sitemap"
          else
            echo "urls=[]" >> $GITHUB_OUTPUT
            echo "WARNING: Sitemap not accessible (HTTP $HTTP_CODE), skipping"
          fi

      - name: Detect IndexNow key
        id: getkey
        run: |
          # 从仓库根目录找 .txt 文件（排除 robots.txt）
          KEY_FILE=$(find . -maxdepth 1 -name '*.txt' ! -name 'robots*' 2>/dev/null | head -1)

          # 从 static/ 目录找
          if [ -z "$KEY_FILE" ]; then
            KEY_FILE=$(find static/ -maxdepth 1 -name '*.txt' ! -name 'robots*' 2>/dev/null | head -1)
          fi

          if [ -n "$KEY_FILE" ]; then
            KEY=$(cat "$KEY_FILE")
            echo "key=$KEY" >> $GITHUB_OUTPUT
            echo "key_file=$KEY_FILE" >> $GITHUB_OUTPUT
            echo "Found key in $KEY_FILE"

            # 验证 key 格式（64 位 hex）
            if echo "$KEY" | grep -qE '^[a-f0-9]{64}$'; then
              echo "Key format: valid (64 hex chars)"
            else
              echo "WARNING: Key does not look like a 64-char hex string"
            fi
          else
            echo "key=" >> $GITHUB_OUTPUT
            echo "key_file=" >> $GITHUB_OUTPUT
            echo "WARNING: No .txt key file found in repo root or static/"
            echo "Create a file named <KEY>.txt containing your 64-char hex IndexNow key"
          fi

      - name: Submit to Bing IndexNow
        if: ${{ steps.getkey.outputs.key != '' && steps.extract.outputs.urls != '[]' }}
        continue-on-error: true
        env:
          KEY: ${{ steps.getkey.outputs.key }}
          HOST: ${{ github.repository_owner }}.github.io
          URLS: ${{ steps.extract.outputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          host = os.environ['HOST']
          key = os.environ['KEY']
          urls = json.loads(os.environ['URLS'])
          batch_size = 1000
          total = 0
          for i in range(0, len(urls), batch_size):
              chunk = urls[i:i+batch_size]
              body = {"host": host, "key": key, "urlList": chunk}
              req = urllib.request.Request(
                  "https://www.bing.com/indexnow",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      result = json.loads(resp.read().decode())
                      rid = result.get('bingRequestId', 'N/A')
                      print(f"Bing: HTTP {resp.status}, {len(chunk)} URLs, RequestID={rid}")
                      total += len(chunk)
              except urllib.error.HTTPError as e:
                  print(f"Bing: HTTP {e.code}: {e.read().decode()[:200]}")
                  total += len(chunk)
              except Exception as e:
                  print(f"Bing: Error - {e}")
                  total += len(chunk)
          print(f"Bing: Total {total}/{len(urls)} URLs submitted")
          PY

      - name: Submit to Yandex
        if: ${{ steps.getkey.outputs.key != '' && steps.extract.outputs.urls != '[]' }}
        continue-on-error: true
        env:
          KEY: ${{ steps.getkey.outputs.key }}
          HOST: ${{ github.repository_owner }}.github.io
          URLS: ${{ steps.extract.outputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          host = os.environ['HOST']
          key = os.environ['KEY']
          urls = json.loads(os.environ['URLS'])
          batch_size = 1000
          total = 0
          for i in range(0, len(urls), batch_size):
              chunk = urls[i:i+batch_size]
              body = {"host": host, "key": key, "urlList": chunk}
              req = urllib.request.Request(
                  "https://yandex.com/indexnow",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      print(f"Yandex: HTTP {resp.status}, {len(chunk)} URLs")
                      total += len(chunk)
              except urllib.error.HTTPError as e:
                  print(f"Yandex: HTTP {e.code}: {e.read().decode()[:200]}")
                  total += len(chunk)
              except Exception as e:
                  print(f"Yandex: Error - {e}")
                  total += len(chunk)
          print(f"Yandex: Total {total}/{len(urls)} URLs submitted")
          PY

      - name: Submit to Seznam
        if: ${{ steps.getkey.outputs.key != '' && steps.extract.outputs.urls != '[]' }}
        continue-on-error: true
        env:
          KEY: ${{ steps.getkey.outputs.key }}
          HOST: ${{ github.repository_owner }}.github.io
          URLS: ${{ steps.extract.outputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          host = os.environ['HOST']
          key = os.environ['KEY']
          urls = json.loads(os.environ['URLS'])
          batch_size = 1000
          total = 0
          for i in range(0, len(urls), batch_size):
              chunk = urls[i:i+batch_size]
              body = {"host": host, "key": key, "urlList": chunk}
              req = urllib.request.Request(
                  "https://search.seznam.cz/indexnow",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      print(f"Seznam: HTTP {resp.status}, {len(chunk)} URLs")
                      total += len(chunk)
              except urllib.error.HTTPError as e:
                  print(f"Seznam: HTTP {e.code}: {e.read().decode()[:200]}")
                  total += len(chunk)
              except Exception as e:
                  print(f"Seznam: Error - {e}")
                  total += len(chunk)
          print(f"Seznam: Total {total}/{len(urls)} URLs submitted")
          PY

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          echo ""
          echo "=== IndexNow Summary ==="
          echo "Key file: ${{ steps.getkey.outputs.key_file || 'NOT FOUND' }}"
          echo "URLs: $(echo '${{ steps.extract.outputs.urls }}' | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '0')"
          echo "Note: Google does NOT support IndexNow. Use Search Console for Google."
          echo "================================"
